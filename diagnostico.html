<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dashboard Diagnostico</title>
<style>
  body { font-family: monospace; background: #0d0d0d; color: #e0e0e0; padding: 20px; }
  h1 { color: #7c6af7; }
  .step { margin: 12px 0; padding: 12px; border-radius: 8px; background: #1a1a2e; border-left: 4px solid #333; }
  .ok    { border-color: #22c55e; }
  .fail  { border-color: #ef4444; }
  .pending { border-color: #f59e0b; }
  .label { font-weight: bold; margin-bottom: 4px; }
  .detail { color: #aaa; font-size: 13px; white-space: pre-wrap; word-break: break-all; }
  button { 
    margin: 8px 4px; padding: 10px 20px; border-radius: 6px; border: none; 
    background: #7c6af7; color: white; cursor: pointer; font-size: 14px;
  }
  button:hover { background: #5a4fd6; }
  #results { margin-top: 20px; }
</style>
</head>
<body>
<h1>🔍 Dashboard — Diagnóstico de Conexión</h1>
<p style="color:#aaa">Haz clic en "Ejecutar Diagnóstico" para identificar el problema de conexión.</p>
<button onclick="runDiag()">▶ Ejecutar Diagnóstico</button>
<button onclick="clearCache()">🗑 Limpiar Caché IndexedDB</button>
<div id="results"></div>

<script>
const SPREADSHEET_ID = "16bU5xUuPDvI6xIpuBabK9j_EiUFgcgMTq1T0S2LeVgQ";
const SPREADSHEET_GID = "999482111";

function addStep(title, status, detail) {
  const div = document.createElement('div');
  div.className = 'step ' + status;
  div.innerHTML = `<div class="label">${status === 'ok' ? '✅' : status === 'fail' ? '❌' : '⏳'} ${title}</div><div class="detail">${detail}</div>`;
  document.getElementById('results').appendChild(div);
  return div;
}

async function runDiag() {
  document.getElementById('results').innerHTML = '<div style="color:#f59e0b">Ejecutando diagnóstico...</div>';
  await new Promise(r => setTimeout(r, 100));
  document.getElementById('results').innerHTML = '';

  // 1. Info básica
  addStep('Protocolo y origen', 'ok', `protocol: ${location.protocol}\norigin: ${location.origin}\nurl: ${location.href}`);

  // 2. Test proxy local
  const proxyStep = addStep('Proxy Local /api/proxy', 'pending', 'Probando...');
  try {
    const t0 = Date.now();
    const r = await fetch('/api/proxy', { signal: AbortSignal.timeout(30000) });
    const text = await r.text();
    const elapsed = Date.now() - t0;
    if (r.ok && text.length > 100) {
      const lines = text.split('\n').length;
      proxyStep.className = 'step ok';
      proxyStep.querySelector('.label').textContent = '✅ Proxy Local /api/proxy';
      proxyStep.querySelector('.detail').textContent = `Status: ${r.status}\nBytes: ${text.length.toLocaleString()}\nLineas: ${lines.toLocaleString()}\nTiempo: ${elapsed}ms\nPrimeras 120 chars: ${text.substring(0, 120)}`;
    } else {
      proxyStep.className = 'step fail';
      proxyStep.querySelector('.label').textContent = '❌ Proxy Local /api/proxy';
      proxyStep.querySelector('.detail').textContent = `Status: ${r.status}\nRespuesta: ${text.substring(0, 200)}`;
    }
  } catch(e) {
    proxyStep.className = 'step fail';
    proxyStep.querySelector('.label').textContent = '❌ Proxy Local /api/proxy';
    proxyStep.querySelector('.detail').textContent = `Error: ${e.message}\n\nSi el error es "Failed to fetch" o "NetworkError", el servidor Python no está corriendo o no responde.`;
  }

  // 3. Test Google Sheets CSV directo
  const csvStep = addStep('CSV Directo Google Sheets', 'pending', 'Probando...');
  try {
    const t0 = Date.now();
    const csvUrl = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${SPREADSHEET_GID}`;
    const r = await fetch(csvUrl, { signal: AbortSignal.timeout(30000) });
    const text = await r.text();
    const elapsed = Date.now() - t0;
    if (r.ok && text.length > 100) {
      csvStep.className = 'step ok';
      csvStep.querySelector('.label').textContent = '✅ CSV Directo Google Sheets';
      csvStep.querySelector('.detail').textContent = `Status: ${r.status}\nBytes: ${text.length.toLocaleString()}\nTiempo: ${elapsed}ms\nPrimeras 120 chars: ${text.substring(0, 120)}`;
    } else {
      csvStep.className = 'step fail';
      csvStep.querySelector('.label').textContent = '❌ CSV Directo Google Sheets';
      csvStep.querySelector('.detail').textContent = `Status: ${r.status}\nEsto puede indicar que el Spreadsheet no es público o hay bloqueo CORS.`;
    }
  } catch(e) {
    csvStep.className = 'step fail';
    csvStep.querySelector('.label').textContent = '❌ CSV Directo Google Sheets';
    csvStep.querySelector('.detail').textContent = `Error: ${e.message}`;
  }

  // 4. Test JSONP GViz
  const jsonpStep = addStep('JSONP GViz Google Sheets', 'pending', 'Probando (timeout 15s)...');
  try {
    const result = await new Promise((resolve, reject) => {
      const cb = 'diag_cb_' + Date.now();
      const timer = setTimeout(() => { delete window[cb]; reject(new Error('Timeout 15s')); }, 15000);
      window[cb] = (json) => {
        clearTimeout(timer);
        delete window[cb];
        resolve(json);
      };
      const s = document.createElement('script');
      s.src = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=responseHandler:${cb}&gid=${SPREADSHEET_GID}&headers=1`;
      s.onerror = () => { clearTimeout(timer); reject(new Error('Script load error')); };
      document.head.appendChild(s);
    });
    if (result && result.table && result.table.rows) {
      jsonpStep.className = 'step ok';
      jsonpStep.querySelector('.label').textContent = '✅ JSONP GViz Google Sheets';
      jsonpStep.querySelector('.detail').textContent = `Filas: ${result.table.rows.length}\nColumnas: ${result.table.cols ? result.table.cols.length : '?'}`;
    } else {
      jsonpStep.className = 'step fail';
      jsonpStep.querySelector('.label').textContent = '❌ JSONP GViz - Sin datos';
      jsonpStep.querySelector('.detail').textContent = JSON.stringify(result).substring(0, 200);
    }
  } catch(e) {
    jsonpStep.className = 'step fail';
    jsonpStep.querySelector('.label').textContent = '❌ JSONP GViz Google Sheets';
    jsonpStep.querySelector('.detail').textContent = `Error: ${e.message}`;
  }

  // 5. Test IndexedDB caché
  const dbStep = addStep('IndexedDB Caché Local', 'pending', 'Verificando...');
  try {
    const req = indexedDB.open('GlomaxVentasDB', 1);
    req.onsuccess = (e) => {
      const db = e.target.result;
      try {
        const tx = db.transaction('rows', 'readonly');
        const q = tx.objectStore('rows').count();
        q.onsuccess = () => {
          const count = q.result;
          dbStep.className = 'step ' + (count > 0 ? 'ok' : 'pending');
          dbStep.querySelector('.label').textContent = (count > 0 ? '✅' : '⚠️') + ' IndexedDB Caché Local';
          dbStep.querySelector('.detail').textContent = `Filas en caché: ${count}\n${count === 0 ? 'Sin caché → primera carga siempre desde red' : 'Caché disponible → carga instantánea en próximo inicio'}`;
        };
      } catch(txe) {
        dbStep.className = 'step fail';
        dbStep.querySelector('.label').textContent = '❌ IndexedDB';
        dbStep.querySelector('.detail').textContent = 'Error de transacción: ' + txe.message;
      }
    };
    req.onerror = (e) => {
      dbStep.className = 'step fail';
      dbStep.querySelector('.label').textContent = '❌ IndexedDB';
      dbStep.querySelector('.detail').textContent = 'No se puede abrir IndexedDB: ' + e.target.error;
    };
  } catch(e) {
    dbStep.className = 'step fail';
    dbStep.querySelector('.label').textContent = '❌ IndexedDB';
    dbStep.querySelector('.detail').textContent = e.message;
  }

  addStep('Diagnóstico completo', 'ok', 
    'Revisa los resultados arriba.\n\n' +
    '• Si Proxy Local falla → el servidor Python no responde (reinicia server.py)\n' +
    '• Si CSV Directo falla → el Spreadsheet tiene restricciones o hay bloqueo CORS\n' +
    '• Si JSONP falla → el Spreadsheet no es público o Google bloquea\n' +
    '• Si todo falla → problema de red o Spreadsheet privado\n\n' +
    'SOLUCIÓN RECOMENDADA: Abre el dashboard desde http://localhost:8000 (NO desde file://)'
  );
}

async function clearCache() {
  try {
    await new Promise((res, rej) => {
      const req = indexedDB.deleteDatabase('GlomaxVentasDB');
      req.onsuccess = () => res();
      req.onerror = (e) => rej(e.target.error);
    });
    alert('✅ Caché IndexedDB eliminado. Recarga el dashboard para empezar desde cero.');
  } catch(e) {
    alert('Error eliminando caché: ' + e.message);
  }
}
</script>
</body>
</html>
